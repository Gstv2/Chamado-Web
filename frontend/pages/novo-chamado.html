<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Chamado - Chamado Web</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/novo-chamado.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          Chamado Web
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a href="chamados.html" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Meus Chamados
        </a>
        <a href="perfil.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Meu Perfil
        </a>
      </nav>
      
      <div class="sidebar-footer">
        Frontend
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="d-flex align-center">
          <button class="btn-mobile-toggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 class="page-title">Novo Chamado</h1>
        </div>
        
        <div class="user-menu">
            <button class="btn-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
          <div class="user-info">
            <span class="user-name" id="user-name-display">João Silva</span>
            <div class="user-avatar">
              <img id="user-avatar-display" src="https://ui-avatars.com/api/?name=Joao+Silva&background=random" alt="Avatar">
            </div>
            <a href="#" id="logout-btn" style="margin-left: 10px; font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">Sair</a>
          </div>
        </div>
      </header>
      
      <div class="modal-card">
        <div class="modal-header">
            <h2 class="modal-title">Novo Chamado</h2>
            <a href="chamados.html" class="btn-close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </a>
        </div>
        
        <div class="modal-body">
            <form id="new-ticket-form">
                <div class="form-group">
                  <label class="form-label" for="titulo">Título <span style="color: var(--danger)">*</span></label>
                  <input type="text" id="titulo" class="form-control" placeholder="Informe um título para seu problema" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="descricao">Descrição <span style="color: var(--danger)">*</span></label>
                    <textarea id="descricao" class="form-control" rows="6" placeholder="Descreva o problema detalhadamente" required></textarea>
                </div>
                
                <div class="form-group">
                  <label class="form-label" for="prioridade">Prioridade <span style="color: var(--danger)">*</span></label>
                  
                  <div class="custom-select-wrapper">
                    <select name="prioridade" id="prioridade" style="display: none;">
                        <option value="BAIXA" selected>Baixa</option>
                        <option value="MEDIA">Média</option>
                        <option value="ALTA">Alta</option>
                    </select>
                    
                    <div class="custom-select" id="custom-prioridade">
                        <div class="custom-select-trigger">
                            <span class="selected-value">
                                <span class="badge-dot" style="background-color: var(--success);"></span> Baixa
                            </span>
                            <div class="arrow"></div>
                        </div>
                        <div class="custom-options">
                            <div class="custom-option selected" data-value="BAIXA">
                                <span class="badge-dot" style="background-color: var(--success);"></span> Baixa
                            </div>
                            <div class="custom-option" data-value="MEDIA">
                                <span class="badge-dot" style="background-color: var(--warning);"></span> Média
                            </div>
                            <div class="custom-option" data-value="ALTA">
                                <span class="badge-dot" style="background-color: var(--danger);"></span> Alta
                            </div>
                        </div>
                    </div>
                  </div>
                </div>
                
                <div class="form-footer">
                  <a href="chamados.html" class="btn btn-secondary">Cancelar</a>
                  <button type="submit" class="btn btn-primary">
                    Abrir Chamado
                  </button>
                </div>
            </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/pages/novo-chamado.js"></script>
</body>
</html>
