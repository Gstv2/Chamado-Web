<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil - Chamado Web</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .profile-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }
    .profile-info h2 {
      margin-bottom: 5px;
      font-size: 1.5rem;
    }
    .profile-role {
      display: inline-block;
      padding: 4px 12px;
      background-color: #e1e4e8;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .info-group {
      margin-bottom: 20px;
    }
    .info-label {
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 5px;
      display: block;
    }
    .info-value {
      font-size: 1.1rem;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          Chamado Web
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a href="chamados.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Meus Chamados
        </a>
        <a href="perfil.html" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Meu Perfil
        </a>
      </nav>
      
      <div class="sidebar-footer">
        Frontend Template
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="d-flex align-center">
          <button class="btn-mobile-toggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 class="page-title">Meu Perfil</h1>
        </div>
        
        <div class="user-menu">
          <div class="user-info">
            <span class="user-name">Usuário</span>
            <div class="user-avatar">
              <img src="https://ui-avatars.com/api/?name=User&background=random" alt="Avatar">
            </div>
          </div>
        </div>
      </header>
      
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="profile-header">
          <img src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile" class="profile-avatar-large" id="profile-avatar">
          <div class="profile-info">
            <h2 id="profile-name">Carregando...</h2>
            <span class="profile-role" id="profile-role">...</span>
          </div>
        </div>
        
        <div class="info-group">
          <span class="info-label">Email</span>
          <span class="info-value" id="profile-email">...</span>
        </div>
        
        <div style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">
          <button id="btn-logout" class="btn btn-danger w-100">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Sair do Sistema
          </button>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/pages/perfil.js"></script>
</body>
</html>
